<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Piano Model X</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{--bg:#080a0e;--panel:#0e121a;--line:#1c2434;--ink:#e5e1dc;--dim:#878b93;--accent:#d8c4a2}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px;background:radial-gradient(ellipse at 50% 0%,#11161f,var(--bg) 70%);color:var(--ink);
  font:14px/1.5 "Jost",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:1040px;width:100%}
h1{font-size:34px;font-weight:400;margin:0 0 4px;text-align:center;letter-spacing:.04em}
.sub{color:var(--dim);text-align:center;margin:0 0 32px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:22px}
/* A card: the photo, then its name below it. A thin border that catches the
   light at the top, and a soft beige glow behind that grows on hover. */
a.card{display:flex;flex-direction:column;position:relative;border-radius:18px;color:inherit;text-decoration:none;
  background:linear-gradient(#11161f,#0d1119) padding-box,linear-gradient(160deg,rgba(216,196,162,.55),rgba(216,196,162,.08) 35%,rgba(141,161,190,.06) 70%,rgba(216,196,162,.3)) border-box;
  border:1px solid transparent;
  box-shadow:0 0 0 1px rgba(0,0,0,.4),0 30px 60px -30px #000,0 0 70px -20px rgba(216,196,162,.14);
  transition:transform .3s,box-shadow .3s}
a.card .ph{margin:8px 8px 0;border-radius:12px;overflow:hidden;background:#000}
a.card img{display:block;width:100%;height:auto;aspect-ratio:3/2;object-fit:cover;transition:transform .6s}
a.card .txt{padding:14px 18px 18px}
a.card h2{font-size:21px;font-weight:500;letter-spacing:.01em;margin:0}
a.card p{color:var(--dim);margin:2px 0 0;font-size:13px}
a.card:hover,a.card:focus-visible{outline:none;transform:translateY(-3px);
  box-shadow:0 0 0 1px rgba(0,0,0,.4),0 36px 70px -30px #000,0 0 90px -10px rgba(216,196,162,.28)}
a.card:hover img,a.card:focus-visible img{transform:scale(1.03)}
kbd{border:1px solid var(--line);border-radius:4px;padding:0 5px;font:12px/1.4 inherit}
</style>
</head>
<body>
<main>
  <h1>Piano Model X</h1>
  <p class="sub">Pick a piano, or press <kbd>1</kbd> or <kbd>2</kbd>.</p>
  <div class="grid">
    <a class="card" href="sampled/" title="A recorded Yamaha C5 (Salamander), repitched onto the fitted scale, with release samples, resonance and room.">
      <div class="ph"><img src="img/grand.webp" alt="A black grand piano under a soft halo of light" width="1600" height="1049"></div>
      <div class="txt"><h2>Classic grand piano</h2><p>A recorded Yamaha C5</p></div>
    </a>
    <a class="card" href="modelled/" title="Physically modelled: every string is its own waveguide, all meeting at a shared bridge. Unison beating and sympathetic resonance fall out of the physics.">
      <div class="ph"><img src="img/clavinet.webp" alt="A wood-cased electric keyboard on chrome legs with a pedal" width="1548" height="1016"></div>
      <div class="txt"><h2>Electric clavinet</h2><p>Physically modelled strings</p></div>
    </a>
  </div>
</main>
<script>
addEventListener('keydown', (e) => {
  if (e.key === '1') location.href = 'sampled/';
  if (e.key === '2') location.href = 'modelled/';
});
</script>
</body>
</html>
